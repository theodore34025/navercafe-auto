[project]
name = "navercafe-auto"
version = "0.1.0"
description = "네이버 카페 로그인 및 게시글·댓글 작성 CLI"
requires-python = ">=3.11"
dependencies = ["playwright==1.55.0", "aiohttp==3.13.2"]

[project.scripts]
navercafe = "navercafe_auto.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navercafe_auto*"]

[tool.setuptools.package-data]
navercafe_auto = ["static/*.html", "static/*.js", "static/*.css"]
